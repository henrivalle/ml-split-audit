[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-split-audit"
version = "0.1.0"
description = "Detect dataset split overlaps using file content and group IDs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/henrivalle/ml-split-audit"
Issues = "https://github.com/henrivalle/ml-split-audit/issues"

[project.scripts]
ml-split-audit = "ml_split_audit:main"

[tool.setuptools]
py-modules = ["ml_split_audit"]
